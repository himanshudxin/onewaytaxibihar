<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium Emerald to Deep Forest Gradient for Driver Partner -->
    <linearGradient id="driverBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Golden Driver Partner Accent Gradient -->
    <linearGradient id="driverGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glass Highlight Border -->
    <linearGradient id="driverBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- 1. Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#driverBgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#driverBorderGrad)" stroke-width="6" />

  <!-- 2. Golden Partner Badge Ring -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="url(#driverGoldGrad)" stroke-width="14" stroke-dasharray="8 4" opacity="0.35" />
  
  <!-- 3. Chauffeur Steering Wheel Emblem -->
  <!-- Outer Wheel Rim -->
  <circle cx="256" cy="230" r="120" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
  <!-- Inner Center Hub -->
  <circle cx="256" cy="230" r="38" fill="url(#driverGoldGrad)" stroke="#ffffff" stroke-width="8" />
  <!-- Wheel Spokes -->
  <line x1="256" y1="268" x2="256" y2="350" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <line x1="222" y1="215" x2="142" y2="185" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <line x1="290" y1="215" x2="370" y2="185" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />

  <!-- 4. Lower Partner Banner Badge -->
  <rect x="80" y="390" width="352" height="66" rx="33" fill="#090d16" stroke="url(#driverGoldGrad)" stroke-width="3.5" />
  <text x="256" y="432" fill="#fbbf24" font-family="'Inter', 'Montserrat', system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="3.5">DRIVER PARTNER</text>
</svg>
